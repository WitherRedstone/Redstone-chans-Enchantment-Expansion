plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    clear()
    maven { name = 'ForgeCDN'; url = 'https://neoforged.forgecdn.net/releases'}
    maven { name = 'ForgeCDNMojang'; url = 'https://neoforged.forgecdn.net/mojang-meta'}
    maven { name = 'Mojang'; url = 'https://libraries.minecraft.net/'}

    mavenLocal()
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // 前置
    localRuntime "curse.maven:selene-499980:7522321"
    localRuntime "curse.maven:bookshelf-228525:7606240"
    localRuntime "curse.maven:puzzles-lib-495476:7140307"
    localRuntime "curse.maven:prickle-1023259:6961457"
    localRuntime "curse.maven:placebo-283644:6926281"
    localRuntime "curse.maven:rhino-416294:7104526"
    localRuntime "curse.maven:cloth-config-348521:5729127"

    // 联动
    //localRuntime "curse.maven:fishing-real-348834:6465668" // 真实钓鱼
    //localRuntime "curse.maven:tide-884685:7586281" // Tide 2

    // 辅助
    implementation "curse.maven:jei-238222:7420587" // JEI
    localRuntime "curse.maven:mmmmmmmmmmmm-225738:7206981" // 试验假人
    localRuntime "curse.maven:overflowing-bars-852662:5770623" // 血量护甲显示上限
    localRuntime "curse.maven:enchantment-descriptions-250419:7039849" // 附魔描述
    localRuntime "curse.maven:attributefix-280510:7115922" // 属性修复
    localRuntime "curse.maven:anvil-never-too-expensive-670282:6056726" // 移除铁砧昂贵
    localRuntime "curse.maven:trade-cycling-570431:6497876" // 交易刷新
    localRuntime "curse.maven:apothic-attributes-898963:7445079" // 神化属性
    localRuntime "curse.maven:jade-324717:7545219" // Jade
    localRuntime "curse.maven:kubejs-238086:7278501" // KubeJS
    localRuntime "curse.maven:appleskin-248787:7854442" // 苹果皮
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
